name: Terraform-DevSecOps

on:
  push:
    branches:
      - "feature/**"
      - main

permissions:
  contents: write
  pull-requests: write

env:
  TF_WORKING_DIR: ./GIT-CONFLICT

jobs:

  # ============================================================
  # STAGE 1 - SECURITY SCAN
  # ============================================================

  security-scan:
    name: Security Scan
    runs-on: self-hosted

    if: |
      startsWith(github.ref, 'refs/heads/feature/') ||
      github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # TFLint
      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint

      # TFSEC
      - name: TFSEC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tfsec .

      # Trivy
      - name: Trivy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          trivy config .


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    needs: security-scan

    if: |
      startsWith(github.ref, 'refs/heads/feature/') ||
      github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Terraform Format
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan

      # Create PR only for feature branch
      - name: Create Pull Request
        if: startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title "Terraform changes - ${GITHUB_REF_NAME}" \
            --body "Automated PR created after successful security scan and Terraform plan."


  # ============================================================
  # STAGE 3 - TERRAFORM APPLY
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    if: github.ref == 'refs/heads/main'

    environment:
      name: terraform-approval

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve