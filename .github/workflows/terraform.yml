name: Terraform-DevSecOps

on:
  push:
    branches:
      - Feature
      - main

permissions:
  contents: write
  pull-requests: write

env:
  TF_WORKING_DIR: .

jobs:

  # ============================================================
  # STAGE 1 - SECURITY SCAN
  # ============================================================

  security-scan:
    name: Security Scan
    runs-on: self-hosted

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # TFLint
      # ----------------------------------------------------------

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "             TFLINT SCAN"
          Write-Host "========================================="

          tflint --init
          tflint

      # ----------------------------------------------------------
      # TFSEC
      # ----------------------------------------------------------

      - name: TFSEC
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "             TFSEC SCAN"
          Write-Host "========================================="

          tfsec .

      # ----------------------------------------------------------
      # Trivy
      # ----------------------------------------------------------

      - name: Trivy
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "             TRIVY SCAN"
          Write-Host "========================================="

          trivy config .


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    needs: security-scan

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Terraform Format
      # ----------------------------------------------------------

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "          TERRAFORM FORMAT"
          Write-Host "========================================="

          terraform fmt -check -recursive

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM INIT"
          Write-Host "========================================="

          terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "          TERRAFORM VALIDATE"
          Write-Host "========================================="

          terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM PLAN"
          Write-Host "========================================="

          terraform plan

      # ========================================================
      # CREATE PULL REQUEST
      # Only Feature branch
      # ========================================================

      - name: Create Pull Request
        if: github.ref == 'refs/heads/Feature'
        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}

        run: |

          Write-Host "========================================="
          Write-Host "       CHECKING PULL REQUEST"
          Write-Host "========================================="

          # ----------------------------------------------------
          # GitHub API Headers
          # ----------------------------------------------------

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          # ----------------------------------------------------
          # Check Existing PR
          # ----------------------------------------------------

          $uri = "https://api.github.com/repos/$env:REPO/pulls?state=open&head=$env:REPO`:$env:BRANCH&base=main"

          $existingPR = Invoke-RestMethod `
            -Uri $uri `
            -Headers $headers `
            -Method Get

          if ($existingPR.Count -eq 0) {

            Write-Host "No open Pull Request found."
            Write-Host "Creating Pull Request..."

            # --------------------------------------------------
            # PR Body
            # --------------------------------------------------

            $body = @{
              title = "Terraform changes - $env:BRANCH"
              head = $env:BRANCH
              base = "main"
              body = @"
          Automated Pull Request

          Validation completed successfully:

          Security Scan:
          - TFLint
          - TFSEC
          - Trivy

          Terraform:
          - terraform fmt
          - terraform init
          - terraform validate
          - terraform plan

          Please review and approve the Pull Request.
          "@
            } | ConvertTo-Json

            # --------------------------------------------------
            # Create PR
            # --------------------------------------------------

            $createUri = "https://api.github.com/repos/$env:REPO/pulls"

            $pr = Invoke-RestMethod `
              -Uri $createUri `
              -Headers $headers `
              -Method Post `
              -Body $body `
              -ContentType "application/json"

            Write-Host ""
            Write-Host "========================================="
            Write-Host "   PULL REQUEST CREATED SUCCESSFULLY"
            Write-Host "========================================="
            Write-Host "PR Number : $($pr.number)"
            Write-Host "PR URL    : $($pr.html_url)"
            Write-Host "========================================="

          }
          else {

            Write-Host ""
            Write-Host "========================================="
            Write-Host "       PULL REQUEST ALREADY EXISTS"
            Write-Host "========================================="
            Write-Host "PR Number : $($existingPR[0].number)"
            Write-Host "PR URL    : $($existingPR[0].html_url)"
            Write-Host "========================================="

          }


  # ============================================================
  # STAGE 3 - TERRAFORM APPLY
  # Only after merge to MAIN
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    if: github.ref == 'refs/heads/main'

    # ----------------------------------------------------------
    # Manual Approval Environment
    # ----------------------------------------------------------

    environment:
      name: terraform-approval

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM INIT"
          Write-Host "========================================="

          terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "          TERRAFORM VALIDATE"
          Write-Host "========================================="

          terraform validate

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM APPLY"
          Write-Host "========================================="

          terraform apply -auto-approve