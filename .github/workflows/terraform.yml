name: Terraform-DevSecOps

on:
  push:
    branches:
      - Feature
      - main

permissions:
  contents: write
  pull-requests: write

env:
  TF_WORKING_DIR: .

jobs:

  # ============================================================
  # STAGE 1 - SECURITY SCAN
  # ============================================================

  security-scan:
    name: Security Scan
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TFLINT ====="
          tflint --init
          tflint

      - name: TFSEC
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TFSEC ====="
          tfsec .

      - name: Trivy
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TRIVY ====="
          trivy config .


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    needs: security-scan

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM FMT ====="
          terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM INIT ====="
          terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM VALIDATE ====="
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM PLAN ====="
          terraform plan

      # ========================================================
      # CREATE PULL REQUEST
      # ========================================================

      - name: Create Pull Request
        if: github.ref == 'refs/heads/Feature'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "===== CHECKING PULL REQUEST ====="

          $PR_EXISTS = gh pr list `
            --base main `
            --head "$env:GITHUB_REF_NAME" `
            --state open `
            --json number `
            --jq "length"

          Write-Host "Open PR count: $PR_EXISTS"

          if ([int]$PR_EXISTS -eq 0) {

            Write-Host "Creating Pull Request..."

            gh pr create `
              --base main `
              --head "$env:GITHUB_REF_NAME" `
              --title "Terraform changes - $env:GITHUB_REF_NAME" `
              --body "Automated PR created after successful Security Scan and Terraform Plan."

          }
          else {

            Write-Host "Pull Request already exists."

          }


  # ============================================================
  # STAGE 3 - TERRAFORM APPLY
  # ONLY AFTER MERGE TO MAIN
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    if: github.ref == 'refs/heads/main'

    environment:
      name: terraform-approval

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM INIT ====="
          terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM VALIDATE ====="
          terraform validate

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM APPLY ====="
          terraform apply -auto-approve