name: Terraform-DevSecOps

on:
  push:
    branches:
      - Feature
      - main

permissions:
  contents: read

env:
  TF_WORKING_DIR: .

jobs:

  # ============================================================
  # STAGE 1 - SECURITY SCAN
  # ============================================================

  security-scan:
    name: Security Scan
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # TFLint
      # --------------------------------------------------------

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "             TFLINT SCAN"
          Write-Host "========================================="

          tflint --init
          tflint

      # --------------------------------------------------------
      # TFSEC
      # --------------------------------------------------------

      - name: TFSEC
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "             TFSEC SCAN"
          Write-Host "========================================="

          tfsec .

      # --------------------------------------------------------
      # Trivy
      # --------------------------------------------------------

      - name: Trivy
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "             TRIVY SCAN"
          Write-Host "========================================="

          trivy config .


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    needs: security-scan

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "          TERRAFORM FORMAT"
          Write-Host "========================================="

          terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM INIT"
          Write-Host "========================================="

          terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "          TERRAFORM VALIDATE"
          Write-Host "========================================="

          terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM PLAN"
          Write-Host "========================================="

          terraform plan


  # ============================================================
  # STAGE 3 - TERRAFORM APPLY
  # ONLY AFTER MERGE TO MAIN
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    if: github.ref == 'refs/heads/main'

    # ----------------------------------------------------------
    # MANUAL APPROVAL
    # ----------------------------------------------------------

    environment:
      name: terraform-approval

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM INIT"
          Write-Host "========================================="

          terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "          TERRAFORM VALIDATE"
          Write-Host "========================================="

          terraform validate

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "            TERRAFORM APPLY"
          Write-Host "========================================="

          terraform apply -auto-approve