name: Terraform-DevSecOps

on:
  push:
    branches:
      - "feature/**"
      - main

permissions:
  contents: write
  pull-requests: write

env:
  TF_WORKING_DIR: .

jobs:

  # ============================================================
  # FEATURE BRANCH
  # SCANNING → FMT → INIT → VALIDATE → PLAN → PR
  # ============================================================

  terraform-plan:
    name: Security Scan + Terraform Plan
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: self-hosted

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Security Scanning
      # --------------------------------------------------------

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint

      - name: TFSEC
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tfsec .

      - name: Trivy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          trivy config .

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan

      # --------------------------------------------------------
      # Create Pull Request
      # --------------------------------------------------------

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title "Terraform changes - ${GITHUB_REF_NAME}" \
            --body "Automated PR created after successful security scanning and Terraform plan."


  # ============================================================
  # MAIN BRANCH
  # FMT → INIT → VALIDATE → PLAN → APPROVAL → APPLY
  # ============================================================

  terraform-apply:
    name: Terraform Plan + Manual Approval + Apply
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    # ----------------------------------------------------------
    # GitHub Environment
    # Required reviewer will approve here
    # ----------------------------------------------------------

    environment:
      name: terraform-approval

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve