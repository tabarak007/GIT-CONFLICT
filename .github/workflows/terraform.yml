name: Terraform CI-CD

on:
  push:
    branches:
      - Feature
      - main

env:
  TF_VERSION: "1.9.8"
  WORKING_DIR: "."

permissions:
  contents: write
  pull-requests: write

jobs:

  # =====================================================
  # SCANNING
  # =====================================================

  terraform-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3


  # =====================================================
  # FEATURE → PLAN
  # =====================================================

  terraform-plan:
    name: Terraform Plan - Feature
    if: github.ref == 'refs/heads/Feature'
    needs: terraform-scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "7a8e96d0-1e46-4e44-8553-7598eef4f67e",
              "clientSecret": "PR58Q~cL6NhdMfvNmgSm.qm8OX6qCQy~7cP47cy0",
              "tenantId": "093e9319-5648-4618-8c7d-f585fb2ed3f9",
              "subscriptionId": "2eeb0869-d474-4f94-a0b0-fb6a5d23d142"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  # =====================================================
  # AUTOMATIC PULL REQUEST
  # Feature → main
  # =====================================================

  create-pr:
    name: Create Pull Request
    if: github.ref == 'refs/heads/Feature'
    needs: terraform-plan
    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: Feature
          title: "Terraform: Feature → Main"
          body: |
            ## Terraform Pull Request

            This PR was automatically created by GitHub Actions.

            ### Validation completed
            - Terraform Format
            - Terraform Validate
            - TFLint
            - tfsec
            - Terraform Plan

            Please review and merge this PR.
          labels: |
            terraform
            automated-pr


  # =====================================================
  # MAIN → PLAN + APPLY
  # =====================================================

  terraform-apply:
    name: Terraform Plan and Apply - Main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "7a8e96d0-1e46-4e44-8553-7598eef4f67e",
              "clientSecret": "PR58Q~cL6NhdMfvNmgSm.qm8OX6qCQy~7cP47cy0",
              "tenantId": "093e9319-5648-4618-8c7d-f585fb2ed3f9",
              "subscriptionId": "2eeb0869-d474-4f94-a0b0-fb6a5d23d142"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan